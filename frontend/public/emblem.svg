<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 30 400 400" width="400" height="400">
  <defs>
    <!-- Outer Ring Gradient: Vivid Green to Deep Ocean Blue -->
    <linearGradient id="embRingGrad" x1="75%" y1="10%" x2="25%" y2="90%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="25%" stop-color="#38A169"/>
      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="85%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>

    <!-- Hands Gradient: Deep Blue wrists to bright Cyan/Teal fingertips -->
    <linearGradient id="embHandLeftGrad" x1="50%" y1="100%" x2="10%" y2="20%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="30%" stop-color="#0369A1"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00A3C4"/>
    </linearGradient>

    <linearGradient id="embHandRightGrad" x1="50%" y1="100%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="30%" stop-color="#0369A1"/>
      <stop offset="70%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00A3C4"/>
    </linearGradient>

    <!-- Sprout Greens -->
    <linearGradient id="embSproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <!-- Network Lines Stroke -->
    <linearGradient id="embNetworkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Clean Circular Background -->
  <circle cx="250" cy="230" r="195" fill="#FFFFFF"/>

  <!-- 1. Outer Ring -->
  <circle cx="250" cy="230" r="172" fill="none" stroke="url(#embRingGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- 2. Cyber / IoT Dome Lines (Upper Hemisphere Network) -->
  <g stroke="url(#embNetworkGrad)" stroke-width="2.2" fill="none" opacity="0.85">
    <path d="M 148 190 C 145 115, 205 80, 250 77 C 295 80, 355 115, 352 190"/>
    <path d="M 165 195 C 160 140, 210 100, 250 100 C 290 100, 340 140, 335 195"/>
    <path d="M 175 197 C 172 155, 215 123, 250 123 C 285 123, 328 155, 325 197"/>
    <path d="M 160 150 C 190 105, 260 90, 310 120"/>
    <path d="M 340 150 C 310 105, 240 90, 190 120"/>
    <path d="M 180 175 C 210 135, 290 135, 320 175"/>
  </g>

  <!-- Network Data Nodes (Cyan & Emerald dots) -->
  <g fill="#0284C7">
    <circle cx="250" cy="77" r="5.5" fill="#10B981"/>
    <circle cx="205" cy="93" r="5" fill="#06B6D4"/>
    <circle cx="295" cy="93" r="5" fill="#10B981"/>
    <circle cx="168" cy="123" r="5" fill="#0EA5E9"/>
    <circle cx="332" cy="123" r="5" fill="#0EA5E9"/>
    <circle cx="145" cy="165" r="5.5" fill="#0284C7"/>
    <circle cx="355" cy="165" r="5.5" fill="#0284C7"/>
    <circle cx="188" cy="153" r="4.5" fill="#10B981"/>
    <circle cx="312" cy="153" r="4.5" fill="#10B981"/>
    <circle cx="225" cy="110" r="4.5" fill="#06B6D4"/>
    <circle cx="275" cy="110" r="4.5" fill="#06B6D4"/>
    <circle cx="363" cy="175" r="5" fill="#0284C7"/>
    <circle cx="137" cy="175" r="5" fill="#0284C7"/>
  </g>

  <!-- 3. Agricultural Sprouts / Seedling in Center -->
  <g>
    <!-- Center Leaf (pointing upward) -->
    <path d="M 250 195 C 248 155, 230 125, 250 110 C 270 125, 252 155, 250 195 Z" fill="url(#embSproutGrad)"/>
    <!-- Left Leaf -->
    <path d="M 248 165 C 230 160, 205 140, 215 120 C 235 125, 245 150, 248 165 Z" fill="#22C55E"/>
    <!-- Right Leaf -->
    <path d="M 252 165 C 270 160, 295 140, 285 120 C 265 125, 255 150, 252 165 Z" fill="#16A34A"/>
    <!-- Central Stem -->
    <path d="M 249 197 L 251 197 L 250.5 155 L 249.5 155 Z" fill="#15803D"/>

    <!-- Left Smaller Sprout -->
    <g transform="translate(-40, 30) scale(0.65) translate(100, 20)">
      <path d="M 250 190 C 248 150, 230 120, 250 105 C 270 120, 252 150, 250 190 Z" fill="#22C55E"/>
      <path d="M 248 160 C 230 155, 205 135, 215 115 C 235 120, 245 145, 248 160 Z" fill="#16A34A"/>
    </g>

    <!-- Right Smaller Sprout -->
    <g transform="translate(130, 30) scale(0.65) translate(-100, 20)">
      <path d="M 250 190 C 248 150, 230 120, 250 105 C 270 120, 252 150, 250 190 Z" fill="#22C55E"/>
      <path d="M 252 160 C 270 155, 295 135, 285 115 C 265 120, 255 145, 252 160 Z" fill="#16A34A"/>
    </g>
  </g>

  <!-- 4. Plowed Field (Furrows radiating in perspective) -->
  <g>
    <!-- Field Backdrop / Base Arc -->
    <path d="M 160 200 C 205 195, 295 195, 340 200 C 330 245, 295 270, 250 285 C 205 270, 170 245, 160 200 Z" fill="#FFFFFF"/>

    <!-- Converging green farm furrows -->
    <path d="M 248 198 L 252 198 L 253 283 L 247 283 Z" fill="#16A34A"/>
    <path d="M 243 199 L 247 199 L 243 282 L 235 280 Z" fill="#22C55E"/>
    <path d="M 233 200 L 238 200 L 226 278 L 217 274 Z" fill="#16A34A"/>
    <path d="M 220 201 L 226 201 L 206 271 L 196 265 Z" fill="#22C55E"/>
    <path d="M 203 202 L 210 202 L 184 260 L 175 253 Z" fill="#16A34A"/>
    <path d="M 185 203 L 193 203 L 168 247 L 162 237 Z" fill="#22C55E"/>

    <path d="M 253 199 L 257 199 L 265 280 L 257 282 Z" fill="#22C55E"/>
    <path d="M 262 200 L 267 200 L 283 274 L 274 278 Z" fill="#16A34A"/>
    <path d="M 274 201 L 280 201 L 304 265 L 294 271 Z" fill="#22C55E"/>
    <path d="M 290 202 L 297 202 L 325 253 L 316 260 Z" fill="#16A34A"/>
    <path d="M 307 203 L 315 203 L 338 237 L 332 247 Z" fill="#22C55E"/>
  </g>

  <!-- 5. Two Caring Hands Cradling the Field -->
  <g>
    <!-- Left Hand -->
    <path d="M 244 350 C 242 325, 240 295, 230 275 C 220 255, 195 250, 175 240 C 160 232, 145 213, 148 195 C 150 187, 155 185, 160 193 C 163 200, 166 215, 175 223 C 172 210, 168 195, 175 187 C 178 183, 184 184, 187 191 C 190 200, 191 215, 197 225 C 198 213, 198 195, 205 191 C 209 188, 214 190, 215 198 C 218 208, 218 223, 222 235 C 227 220, 232 210, 237 210 C 242 210, 242 220, 238 237 C 235 251, 234 270, 238 290 C 240 300, 243 330, 245 350 Z" fill="url(#embHandLeftGrad)"/>

    <!-- Right Hand -->
    <path d="M 256 350 C 258 325, 260 295, 270 275 C 280 255, 305 250, 325 240 C 340 232, 355 213, 352 195 C 350 187, 345 185, 340 193 C 337 200, 334 215, 325 223 C 328 210, 332 195, 325 187 C 322 183, 316 184, 313 191 C 310 200, 309 215, 303 225 C 302 213, 302 195, 295 191 C 291 188, 286 190, 285 198 C 282 208, 282 223, 278 235 C 273 220, 268 210, 263 210 C 258 210, 258 220, 262 237 C 265 251, 266 270, 262 290 C 260 300, 257 330, 255 350 Z" fill="url(#embHandRightGrad)"/>

    <!-- Palm Shadow & Contour Accents -->
    <path d="M 240 300 C 232 285, 218 273, 200 263 C 185 255, 168 245, 155 225 C 160 243, 178 260, 195 271 C 215 285, 230 300, 240 335 Z" fill="#0369A1" opacity="0.6"/>
    <path d="M 260 300 C 268 285, 282 273, 300 263 C 315 255, 332 245, 345 225 C 340 243, 322 260, 305 271 C 285 285, 270 300, 260 335 Z" fill="#0369A1" opacity="0.6"/>
  </g>
</svg>
